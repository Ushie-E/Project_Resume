name: Deploy Flutter Web to Vercel (Staging & Production)

on:
  push:
    branches: [ main, staging ]

jobs:
  deploy-to-vercel:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Quality & Tests
        run: |
          flutter analyze
          flutter test test/viewmodels/home_viewmodel_test.dart test/viewmodels/explore_viewmodel_test.dart

      - name: Build Flutter Web (Staging)
        if: github.ref == 'refs/heads/staging'
        run: flutter build web -t lib/main_staging.dart --release --base-href "/"

      - name: Build Flutter Web (Production)
        if: github.ref == 'refs/heads/main'
        run: flutter build web -t lib/main_prod.dart --release --base-href "/"

      - name: Deploy via Vercel CLI (Staging)
        if: github.ref == 'refs/heads/staging'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Deploying to Vercel Staging preview environment via git integration."
          else
            npx vercel --token="$VERCEL_TOKEN" --yes
          fi

      - name: Deploy via Vercel CLI (Production)
        if: github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Deploying to Vercel Production environment via git integration."
          else
            npx vercel --prod --token="$VERCEL_TOKEN" --yes
          fi
