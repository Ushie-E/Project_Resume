name: Deploy Flutter Web to Vercel

on:
  push:
    branches: [ main ]

jobs:
  deploy-to-vercel:
    name: Build & Deploy Flutter Web to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        run: flutter build web --release --base-href "/"

      - name: Deploy via Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret is not configured in GitHub repository secrets."
            echo "Vercel automatically deploys your project via its native GitHub Integration at https://vercel.com/ushie-code."
            echo "To enable GitHub Actions deployment, add VERCEL_TOKEN to Repository Settings -> Secrets and Variables -> Actions."
          else
            npx vercel --prod --token="$VERCEL_TOKEN" --yes
          fi
