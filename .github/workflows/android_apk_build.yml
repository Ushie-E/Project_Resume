name: Android APK Build & Test Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-android-apk:
    name: Build Android Flavored APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build Dev Debug APK
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - name: Build Prod Release APK
        run: flutter build apk --release --flavor prod -t lib/main_prod.dart
